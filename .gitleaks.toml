# gitleaks configuration for argo-pack.
#
# Two jobs:
#   1. the upstream secret rules (extended below), and
#   2. the private-reference rules that keep this PUBLIC repository free of host names,
#      addresses, home paths and internal deployment names.
#
# Rule (2) is deliberately duplicated in `packages/pack-lint` so that `npm run lint` catches
# the same things without a gitleaks binary present. Keep the two in step.

title = "argo-pack"

[extend]
useDefault = true

# --------------------------------------------------------------------------------------
# private references
# --------------------------------------------------------------------------------------

[[rules]]
id = "argo-private-ipv4"
description = "IPv4 literal (private references must not appear in a public pack)"
# The bracketed edges (RE2 has no lookaround) keep a six-component version string from
# reading as an address.
regex = '''(?:^|[^0-9.])((?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9]))(?:[^0-9.]|$)'''
tags = ["private-ref"]
[rules.allowlist]
regexes = [
  '''\b0\.0\.0\.0\b''',
  '''\b127\.0\.0\.1\b''',
  '''\b255\.255\.255\.255\b''',
  # documentation ranges, RFC 5737
  '''\b192\.0\.2\.\d{1,3}\b''',
  '''\b198\.51\.100\.\d{1,3}\b''',
  '''\b203\.0\.113\.\d{1,3}\b''',
]

[[rules]]
id = "argo-private-ipv6"
description = "IPv6 literal"
regex = '''(?i)\b(?:[0-9a-f]{1,4}:){4,7}[0-9a-f]{1,4}\b'''
tags = ["private-ref"]

[[rules]]
id = "argo-internal-hostname"
description = "hostname in an internal or link-local zone"
regex = '''(?i)\b[a-z0-9][a-z0-9-]{0,62}\.(?:lan|local|internal|intranet|home|corp|localdomain|in-addr\.arpa|ip6\.arpa)\b'''
tags = ["private-ref"]

[[rules]]
id = "argo-mesh-hostname"
description = "hostname in an overlay or tunnel namespace"
regex = '''(?i)\b[a-z0-9][a-z0-9-]{0,62}\.(?:ts\.net|onion|tailnet|wg)\b'''
tags = ["private-ref"]

[[rules]]
id = "argo-home-path"
description = "home-directory path (leaks an operator's username or layout)"
regex = '''(?:~/[A-Za-z0-9._-]|/home/[A-Za-z0-9._-]+/|/Users/[A-Za-z0-9._-]+/|/root/[A-Za-z0-9._-])'''
tags = ["private-ref"]
[rules.allowlist]
regexes = [
  # the literal examples in the docs that explain this rule
  '''/home/<user>/''',
  '''/Users/<user>/''',
]

[[rules]]
id = "argo-ssh-uri"
description = "ssh or scp target naming a concrete host"
regex = '''(?i)\b(?:ssh|scp|rsync)\s+(?:-\S+\s+)*[a-z0-9._-]+@[a-z0-9._-]+'''
tags = ["private-ref"]

# --------------------------------------------------------------------------------------
# allowlist
# --------------------------------------------------------------------------------------

[allowlist]
description = "paths that cannot carry private references by construction"
paths = [
  # the files that DEFINE the private-reference rules necessarily contain the patterns
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)packages/pack-lint/src/private-refs\.ts$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)LICENSE$''',
  '''(^|/)\.git/''',
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
]
