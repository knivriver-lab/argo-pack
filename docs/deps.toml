# The dependency edges, written down once so the graph can be read without
# opening every unit. C6 holds this file and the units' own front matter in agreement.
#
# 0000-law-plank is the first unit and depends on nothing, so it has no edge of its own.

[[edge]]
from = "0001-served-bands"
to = "0000-law-plank"

[[edge]]
from = "0002-ticket-pathway-validation"
to = "0000-law-plank"

# The mirror is a second view of the band P1 built, and reuses its route, its bearer and its
# sign-in. It depends on that unit rather than on the law plank it never touches.
[[edge]]
from = "0003-berth-sessions"
to = "0001-served-bands"
