# law-plank — diagnostics for unit documents.
plank: mewd.law-plank
face: A6-working

keel: mewd

# One tool, and it is the only MCP grant held anywhere in this pack.
#
# `propose` hands an open question this plank already found to the fabric, as a proposal for
# somebody to decide on. It is named in `src/propose.ts` as PROPOSE_TOOL; pack-lint fails any
# name listed here that the plank's own source never references, so this list cannot grow ahead
# of the code, and the code cannot lose its grant quietly either.
consumes:
  mcp_tools:
    - propose
  mcp_streams: []

# It draws findings, and beside one of them it now offers something: "propose this open question
# as an OIP". The proposing is still the operator's — nothing is sent until they choose it, and
# what the fabric does with a proposal is the fabric's business.
affordance_class: effect-surfacing

state_policy: cache-only
swap_invariant: install-uninstall

upstream:
  - diagnostics
  - code-actions

terminal: NEVER-DECLARED
schema: 1
